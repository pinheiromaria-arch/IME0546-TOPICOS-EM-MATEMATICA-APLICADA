<script>
(function () {
  var toc = document.getElementById("TOC");
  if (!toc) return;

  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "toc-toggle";
  btn.setAttribute("aria-expanded", "false");
  btn.setAttribute("aria-controls", "TOC");
  btn.textContent = "Tópicos";
  document.body.insertBefore(btn, document.body.firstChild);

  var backdrop = document.createElement("div");
  backdrop.className = "toc-backdrop";
  document.body.insertBefore(backdrop, toc);

  toc.querySelectorAll("li").forEach(function (li) {
    var child = null;
    for (var n = li.firstElementChild; n; n = n.nextElementSibling) {
      if (n.tagName === "UL") child = n;
    }
    if (!child) return;
    li.classList.add("toc-branch", "toc-collapsed");
    var link = null;
    for (var n = li.firstElementChild; n; n = n.nextElementSibling) {
      if (n.tagName === "A") { link = n; break; }
    }
    var row = document.createElement("div");
    row.className = "toc-row";
    var caret = document.createElement("button");
    caret.type = "button";
    caret.className = "toc-caret";
    caret.setAttribute("aria-expanded", "false");
    caret.setAttribute("aria-label", "Expandir ou recolher subtópicos");
    if (link) li.insertBefore(row, link);
    else li.insertBefore(row, child);
    row.appendChild(caret);
    if (link) row.appendChild(link);
    caret.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      var collapsed = li.classList.toggle("toc-collapsed");
      caret.setAttribute("aria-expanded", collapsed ? "false" : "true");
    });
  });

  function setOpen(open) {
    document.body.classList.toggle("toc-open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  }

  btn.addEventListener("click", function () {
    setOpen(!document.body.classList.contains("toc-open"));
  });
  backdrop.addEventListener("click", function () { setOpen(false); });
  toc.addEventListener("click", function (e) {
    if (e.target.closest("a") && window.matchMedia("(max-width: 1099px)").matches) {
      setOpen(false);
    }
  });

  var links = Array.prototype.slice.call(toc.querySelectorAll("a[href^='#']"));
  var seen = {};
  var sections = [];
  links.forEach(function (a) {
    var id = decodeURIComponent((a.getAttribute("href") || "").slice(1));
    if (!id || seen[id]) return;
    var el = document.getElementById(id);
    if (!el) return;
    seen[id] = true;
    sections.push({ id: id, el: el, a: a });
  });
  if (!sections.length || !("IntersectionObserver" in window)) return;

  var current = null;
  function activate(id) {
    if (current === id) return;
    current = id;
    links.forEach(function (a) {
      var on = decodeURIComponent((a.getAttribute("href") || "").slice(1)) === id;
      a.classList.toggle("active", on);
      if (on) {
        var node = a.closest("li");
        while (node) {
          if (node.classList.contains("toc-branch")) {
            node.classList.remove("toc-collapsed");
            var c = node.querySelector(".toc-row > .toc-caret");
            if (c) c.setAttribute("aria-expanded", "true");
          }
          node = node.parentElement ? node.parentElement.closest("li") : null;
        }
      }
    });
  }

  var observer = new IntersectionObserver(function (entries) {
    var visible = entries
      .filter(function (e) { return e.isIntersecting; })
      .sort(function (a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
    if (visible.length) activate(visible[0].target.id);
  }, { rootMargin: "0px 0px -70% 0px", threshold: 0.01 });

  sections.forEach(function (s) { observer.observe(s.el); });
})();
</script>
